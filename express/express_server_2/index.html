<!doctype html>
<html>
    <head>
    <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>
    <body class="text-center grid p-5 ">
        <h1 class=" text-red-800 text-3xl font-bold underline">Calculator Machine!</h1>
        <form action="/" method="post" class="grid justfy-center item-center p-5 gap-3 ">
            <input type="text" name="num1" placeholder="first number" class="border tracking-wide font-bold rounded-md px-5 py-3 text-2xl">
            <input type="text" name="num2" placeholder="Second number" class="border font-bold tracking-wide rounded-md px-5 py-3 text-2xl" >
            <button type="submit" name="submit" class="text-3xl font-bold font-mono hover:bg-blue-700 hover:text-gray-100 py-4 bg-blue-200 transition duration-500 ease-in-out rounded-md shadow-sm ">Calculate</button>
        </form>
        <small>MubeelDev</small>
    </body>
</html>
