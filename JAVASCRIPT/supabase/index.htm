<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Signup</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            margin: 0;
            background: #f7fafc;
        }
        .card {
            width: min(420px, calc(100vw - 32px));
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 18px 50px rgba(15, 23, 42, 0.12);
            background: white;
        }
        .card h1 {
            margin: 0 0 18px;
            font-size: 1.6rem;
        }
        .field {
            display: grid;
            gap: 8px;
            margin-bottom: 16px;
        }
        .field label {
            font-size: 0.95rem;
            color: #334155;
        }
        .field input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 1rem;
        }
        button {
            width: 100%;
            padding: 12px 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover {
            background: #1d4ed8;
        }
        #message {
            margin-top: 16px;
            color: #1d4ed8;
            min-height: 1.2em;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Create an account</h1>
        <form id="signup-form">
            <div class="field">
                <label for="name">Name</label>
                <input id="name" name="name" type="text" required autocomplete="name" />
            </div>
            <button type="submit">Sign up</button>
        </form>
        <p id="message"></p>
    </main>

    <script type="module" src="./script.js"></script>
</body>
</html>
